name: Build and deploy Soul Crystal

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements-assets.txt

      - name: Install build dependencies
        run: |
          npm ci --prefix web
          python3 -m pip install -r web/requirements-assets.txt
          python3 -c "from PIL import features; assert features.check('webp'), 'Pillow needs WebP support'"

      - name: Build WebAssembly engine
        env:
          DOCKER_BUILDKIT: '1'
        run: ./build_wasm_docker.sh

      - name: Test game engine and web logic
        run: |
          npm test --prefix web
          npm run test:wasm --prefix web

      - name: Compress images and build website
        run: npm run build --prefix web

      - name: Verify built assets and cutscene references
        run: npm run test:build-assets --prefix web

      - name: Check served image URLs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/web > "$RUNNER_TEMP/pages-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:assets --prefix web -- http://127.0.0.1:8765/

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
